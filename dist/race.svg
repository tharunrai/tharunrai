            #car {
                /* Total duration approx 8 seconds for a lap */
                animation: carMove 8s linear infinite;
            }
            .title {
                font-family: 'Segoe UI', Arial, sans-serif;
                fill: #c9d1d9;
                font-size: 16px;
                font-weight: 600;
            }
            .subtitle {
                font-family: 'Segoe UI', Arial, sans-serif;
                fill: #8b949e;
                font-size: 12px;
